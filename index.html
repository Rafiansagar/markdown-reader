<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WP Readme Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
	--app-bg: #f0f0f1;
	--app-panel: #fff;
	--app-line: #dcdcde;
	--app-text: #1d2327;
	--app-muted: #646970;
	--app-accent: #2271b1;

	--wp-blue: #3858e9;
	--wp-blue-dark: #2145e6;
	--wp-text: #1e1e1e;
	--wp-muted: #656a71;
	--wp-line: #d9d9d9;
	--wp-soft: #f6f6f6;

	--err: #d63638;
	--warn: #dba617;
	--info: #72aee6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--app-bg);
	color: var(--app-text);
	font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	display: flex;
	flex-direction: column;
}

/* ---------- app chrome ---------- */
.toolbar {
	display: flex;
	align-items: center;
	gap: 8px;
	flex-wrap: wrap;
	padding: 10px 16px;
	background: #1d2327;
	color: #fff;
}
.toolbar h1 { font-size: 15px; font-weight: 600; margin: 0 12px 0 0; display: flex; align-items: center; gap: 8px; }
.toolbar h1 svg { width: 22px; height: 22px; }
.toolbar .spacer { flex: 1; }
.tb-btn {
	appearance: none;
	border: 1px solid #50575e;
	background: #2c3338;
	color: #f0f0f1;
	padding: 6px 12px;
	border-radius: 3px;
	font: inherit;
	font-size: 13px;
	cursor: pointer;
}
.tb-btn:hover { background: #3c434a; }
.tb-btn.primary { background: var(--app-accent); border-color: var(--app-accent); }
.tb-btn.primary:hover { background: #135e96; }
.seg { display: inline-flex; border: 1px solid #50575e; border-radius: 3px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: #2c3338; color: #c3c4c7; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid #50575e; }
.seg button[aria-pressed="true"] { background: #f0f0f1; color: #1d2327; }

.workspace { flex: 1; display: grid; grid-template-columns: var(--left, 38%) 8px minmax(0, 1fr); min-height: 0; }
body[data-view="preview"] .workspace,
body[data-view="edit"] .workspace { grid-template-columns: minmax(0, 1fr); }
body[data-view="preview"] .editor-pane,
body[data-view="preview"] .gutter,
body[data-view="edit"] .gutter,
body[data-view="edit"] .preview-pane { display: none; }

/* show / hide blocks */
/* source bar */
.source-bar {
	display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
	padding: 8px 16px;
	background: #2c3338; color: #dcdcde;
	border-top: 1px solid #3c434a;
}
.source-bar > label:first-child { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #a7aaad; }
.source-bar input[type="text"] {
	flex: 1 1 360px; min-width: 0;
	background: #1d2327; color: #f0f0f1;
	border: 1px solid #50575e; border-radius: 3px;
	padding: 6px 10px;
	font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
}
.source-bar input[type="text"]:focus { outline: 2px solid var(--app-accent); outline-offset: -1px; }
.src-status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #c3c4c7; min-width: 0; overflow-wrap: anywhere; }
.live-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.src-status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #8c8f94; }
.src-status.live .dot { background: #00ba37; box-shadow: 0 0 0 0 rgba(0,186,55,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px rgba(0,186,55,0); } 100% { box-shadow: 0 0 0 0 rgba(0,186,55,0); } }
@media (prefers-reduced-motion: reduce) { .src-status.live .dot { animation: none; } }
.src-status.ok .dot { background: #00ba37; }
.src-status.busy .dot { background: var(--warn); }
.src-status.err { color: #ffabaf; }
.src-status.err .dot { background: var(--err); }
.src-status code { background: #1d2327; padding: 0 4px; border-radius: 2px; color: #f0f0f1; }
body.linked #src { background: #fafafa; color: #3c434a; }
body.hide-source .source-bar { display: none; }

.blocks-menu { position: relative; }
.blocks-menu summary { list-style: none; display: inline-block; }
.blocks-menu summary::-webkit-details-marker { display: none; }
.blocks-menu summary::after { content: " ▾"; font-size: 11px; }
.blocks-menu[open] summary { background: #3c434a; }
.blocks-pop {
	position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
	min-width: 210px; padding: 8px 0;
	background: #fff; color: var(--app-text);
	border: 1px solid var(--app-line); border-radius: 4px;
	box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.blocks-pop label { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
.blocks-pop label:hover { background: #f0f0f1; }
.blocks-pop hr { border: 0; border-top: 1px solid var(--app-line); margin: 6px 0; }

body.hide-validator .blk-validator,
body.hide-card .blk-card,
body.hide-validator.hide-card .side-panels,
body.hide-header .wp-banner,
body.hide-header .wp-header,
body.hide-header .short-desc,
body.hide-tabs .wp-tabs,
body.hide-sidebar .wp-meta { display: none; }
body.hide-sidebar .wp-grid { grid-template-columns: minmax(0, 1fr); }

.gutter {
	position: relative;
	cursor: col-resize;
	background: var(--app-bg);
	border-left: 1px solid var(--app-line);
	border-right: 1px solid var(--app-line);
	touch-action: none;
	outline: none;
}
.gutter::after {
	content: "";
	position: absolute;
	top: 50%; left: 50%;
	width: 2px; height: 32px;
	transform: translate(-50%, -50%);
	border-left: 1px solid #a7aaad;
	border-right: 1px solid #a7aaad;
}
.gutter:hover, .gutter:focus-visible, body.resizing .gutter { background: #c5d9ed; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing .preview-pane, body.resizing textarea { pointer-events: none; }

.editor-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--app-panel); }
.editor-pane textarea {
	flex: 1;
	min-height: 240px;
	width: 100%;
	border: 0;
	resize: none;
	padding: 14px 16px;
	font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
	color: #1d2327;
	background: #fff;
	outline: none;
	tab-size: 4;
}
.side-panels { border-top: 1px solid var(--app-line); max-height: 45%; overflow: auto; background: #fbfbfc; }
.panel-h {
	display: flex; align-items: center; gap: 8px;
	padding: 8px 16px;
	font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--app-muted);
	border-bottom: 1px solid var(--app-line);
	position: sticky; top: 0; background: #fbfbfc;
}
.counts { margin-left: auto; display: flex; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.count { padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #e6e6e6; color: #1d2327; }
.count.err { background: #facfd2; color: #8a2424; }
.count.warn { background: #fcf0c3; color: #6b4d00; }
.issues { list-style: none; margin: 0; padding: 4px 0; }
.issues li { display: flex; gap: 10px; padding: 6px 16px; font-size: 13px; }
.issues li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--info); }
.issues li.error::before { background: var(--err); }
.issues li.warning::before { background: var(--warn); }
.issues li.ok::before { background: #00a32a; }
.issues code, .hint code { font-size: 12px; background: #f0f0f1; padding: 0 4px; border-radius: 2px; }

.card-preview { padding: 12px 16px 16px; }
.search-card { display: flex; gap: 14px; padding: 16px; background: #fff; border: 1px solid var(--wp-line); border-radius: 2px; font-family: Inter, -apple-system, sans-serif; color: var(--wp-text); }
.search-card .icon { flex: none; width: 64px; height: 64px; border-radius: 2px; overflow: hidden; }
.search-card .icon > * { width: 100%; height: 100%; display: block; object-fit: cover; }
.search-card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--wp-blue); }
.search-card p { margin: 0; font-size: 13px; color: var(--wp-muted); }
.search-card .cut { background: #fcf0c3; }
.hint { font-size: 12px; color: var(--app-muted); padding: 0 16px 12px; margin: 0; }

.preview-pane { overflow: auto; min-height: 0; background: #fff; position: relative; }

.drop-overlay {
	position: fixed; inset: 0; z-index: 50;
	display: none; align-items: center; justify-content: center;
	background: rgba(34, 113, 177, .12);
	border: 3px dashed var(--app-accent);
	font-size: 20px; font-weight: 600; color: var(--app-accent);
	pointer-events: none;
}
body.dragging .drop-overlay { display: flex; }

/* ---------- wordpress.org look ---------- */
.wporg {
	font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	color: var(--wp-text);
	font-size: 15px;
	line-height: 1.7;
	max-width: 1000px;
	margin: 0 auto;
	padding: 32px 24px 64px;
}
.wporg a { color: var(--wp-blue); text-decoration: underline; text-underline-offset: 2px; }
.wporg a:hover { color: var(--wp-blue-dark); }

.wp-banner {
	position: relative;
	width: 100%;
	aspect-ratio: 772 / 250;
	border-radius: 2px;
	background: var(--wp-soft) center / cover no-repeat;
	margin-bottom: 24px;
}
.wp-header { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
.wp-icon { flex: none; width: 96px; height: 96px; border-radius: 2px; overflow: hidden; }
.wp-icon > * { width: 100%; height: 100%; display: block; object-fit: cover; }
.wp-title-wrap { flex: 1; min-width: 0; }
.wp-title { font-size: 32px; line-height: 1.2; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.wp-byline { color: var(--wp-muted); font-size: 15px; }
.wp-byline a { color: var(--wp-text); }
.wp-download {
	flex: none;
	display: inline-block;
	background: var(--wp-blue);
	color: #fff !important;
	text-decoration: none !important;
	padding: 14px 28px;
	border-radius: 2px;
	font-weight: 500;
	font-size: 15px;
	line-height: 1;
}
.wp-download:hover { background: var(--wp-blue-dark); }

.wp-tabs {
	display: flex;
	gap: 4px;
	border-bottom: 1px solid var(--wp-line);
	margin: 32px 0 32px;
	overflow-x: auto;
}
.wp-tabs button {
	appearance: none;
	background: none;
	border: 0;
	border-bottom: 3px solid transparent;
	padding: 12px 14px;
	margin-bottom: -1px;
	font: inherit;
	font-size: 15px;
	color: var(--wp-text);
	cursor: pointer;
	white-space: nowrap;
}
.wp-tabs button:hover { color: var(--wp-blue); }
.wp-tabs button[aria-selected="true"] { border-bottom-color: var(--wp-text); font-weight: 600; }
.wp-tabs .support { margin-left: auto; }

.wp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; }
.wp-pane[hidden] { display: none; }

.wp-content h2 { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 40px 0 16px; }
.wp-content > section:first-child > h2:first-child,
.wp-pane > section:first-child > h2:first-child { margin-top: 0; }
.wp-content h3 { font-size: 18px; font-weight: 600; margin: 28px 0 10px; }
.wp-content h4 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.wp-content h5 { font-size: 15px; font-weight: 600; margin: 20px 0 6px; }
.wp-content p { margin: 0 0 16px; }
.wp-content ul, .wp-content ol { margin: 0 0 16px; padding-left: 1.6em; }
.wp-content li { margin: 4px 0; }
.wp-content li > ul, .wp-content li > ol { margin: 4px 0; }
.wp-content code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .87em; background: var(--wp-soft); padding: 2px 5px; border-radius: 2px; }
.wp-content pre { background: var(--wp-soft); padding: 16px; overflow: auto; border-radius: 2px; font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
.wp-content pre code { background: none; padding: 0; font-size: inherit; }
.wp-content blockquote { margin: 0 0 16px; padding: 4px 0 4px 20px; border-left: 3px solid var(--wp-text); }
.wp-content blockquote p:last-child { margin-bottom: 0; }
.wp-content img { max-width: 100%; height: auto; }
.wp-content hr { border: 0; border-top: 1px solid var(--wp-line); margin: 32px 0; }
.wp-content table { border-collapse: collapse; margin: 0 0 16px; width: 100%; font-size: 14px; }
.wp-content th, .wp-content td { border: 1px solid var(--wp-line); padding: 8px 10px; text-align: left; }
.wp-content th { background: var(--wp-soft); font-weight: 600; }
.wp-empty { color: var(--wp-muted); }

/* screenshots */
.wp-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; margin: 0 0 16px; padding: 0; list-style: none; }
.wp-shots li { margin: 0; }
.wp-shots button { all: unset; display: block; width: 100%; cursor: zoom-in; }
.wp-shots .ph {
	aspect-ratio: 4 / 3;
	border: 1px solid var(--wp-line);
	background: var(--wp-soft);
	display: flex; align-items: center; justify-content: center;
	color: var(--wp-muted); font-size: 12px; text-align: center; padding: 8px;
	border-radius: 2px;
}
.wp-shots img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; border: 1px solid var(--wp-line); border-radius: 2px; display: block; }
.wp-shots figcaption { font-size: 13px; color: var(--wp-muted); margin-top: 8px; line-height: 1.5; }

/* faq */
.wp-faq { margin: 0 0 16px; border-top: 1px solid var(--wp-line); }
.wp-faq dt { margin: 0; border-bottom: 1px solid var(--wp-line); }
.wp-faq dt button {
	all: unset; box-sizing: border-box;
	display: flex; align-items: center; gap: 12px; width: 100%;
	padding: 16px 4px; cursor: pointer;
	font-weight: 600; font-size: 15px;
}
.wp-faq dt button:hover { color: var(--wp-blue); }
.wp-faq dt button::after {
	content: ""; margin-left: auto; flex: none;
	width: 8px; height: 8px;
	border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
	transform: rotate(45deg) translate(-2px, -2px);
	transition: transform .15s;
}
.wp-faq dt.open button::after { transform: rotate(225deg) translate(-2px, -2px); }
.wp-faq dd { margin: 0; padding: 4px 4px 12px; border-bottom: 1px solid var(--wp-line); }
.wp-faq dd[hidden] { display: none; }

/* contributors */
.wp-people { list-style: none; padding: 0; margin: 0 0 16px; }
.wp-people li { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600; text-transform: uppercase; }

/* sidebar */
.wp-meta { font-size: 14px; }
.wp-meta ul { list-style: none; padding: 0; margin: 0 0 8px; }
.wp-meta li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--wp-line); }
.wp-meta li strong { font-weight: 600; text-align: right; }
.wp-meta li.na strong { color: var(--wp-muted); font-weight: 400; }
.wp-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.wp-tags a { text-decoration: none !important; background: var(--wp-soft); color: var(--wp-text) !important; padding: 2px 10px; border-radius: 2px; font-size: 13px; font-weight: 400; }
.wp-tags a.over { text-decoration: line-through !important; color: var(--wp-muted) !important; }
.wp-advanced { display: block; text-align: center; margin: 16px 0 40px; font-size: 14px; }
.wp-meta h3 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
.wp-meta .box { margin-bottom: 40px; }
.stars { color: var(--wp-muted); letter-spacing: 2px; font-size: 18px; }
.wp-btn-outline {
	display: inline-block; text-decoration: none !important;
	border: 1px solid var(--wp-blue); color: var(--wp-blue) !important;
	padding: 10px 18px; border-radius: 2px; font-size: 14px; font-weight: 500;
}
.wp-btn-outline:hover { background: var(--wp-blue); color: #fff !important; }

.short-desc { font-size: 17px; color: var(--wp-muted); margin: 18px 0 0; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 100%; max-height: 85vh; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
.lightbox p { color: #fff; margin: 14px 0 0; text-align: center; max-width: 800px; }

@media (max-width: 900px) {
	.workspace { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: auto auto; }
	.gutter { display: none; }
	.editor-pane { border-right: 0; border-bottom: 1px solid var(--app-line); }
	.editor-pane textarea { min-height: 50vh; }
	.side-panels { max-height: none; }
	.wp-grid { grid-template-columns: 1fr; gap: 32px; }
	body { height: auto; }
	.preview-pane { overflow: visible; }
}
@media (max-width: 600px) {
	.wporg { padding: 20px 16px 48px; }
	.wp-header { flex-wrap: wrap; }
	.wp-icon { width: 64px; height: 64px; }
	.wp-title { font-size: 24px; }
	.wp-download { width: 100%; text-align: center; }
	.toolbar h1 { width: 100%; }
}
</style>
</head>
<body data-view="split">

<header class="toolbar">
	<h1>
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7M9 9h3"/></svg>
		WP Readme Viewer
	</h1>
	<button class="tb-btn primary" id="btn-open">Open readme.txt</button>
	<button class="tb-btn" id="btn-assets" title="banner-772x250.png, icon-128x128.png, screenshot-1.png …">Add images</button>
	<button class="tb-btn" id="btn-sample">Load sample</button>
	<button class="tb-btn" id="btn-copy">Copy HTML</button>
	<span class="spacer"></span>
	<details class="blocks-menu" id="blocks-menu">
		<summary class="tb-btn">Show / hide</summary>
		<div class="blocks-pop">
			<label><input type="checkbox" data-block="source" checked> Source bar</label>
			<label><input type="checkbox" data-block="validator" checked> Validator</label>
			<label><input type="checkbox" data-block="card" checked> Search result card</label>
			<hr>
			<label><input type="checkbox" data-block="header" checked> Plugin header</label>
			<label><input type="checkbox" data-block="tabs" checked> Tabs</label>
			<label><input type="checkbox" data-block="sidebar" checked> Sidebar</label>
		</div>
	</details>
	<div class="seg" role="group" aria-label="View">
		<button data-view="edit" aria-pressed="false">Editor</button>
		<button data-view="split" aria-pressed="true">Split</button>
		<button data-view="preview" aria-pressed="false">Preview</button>
	</div>
	<input type="file" id="file-readme" accept=".txt,.md,text/plain,text/markdown" hidden>
	<input type="file" id="file-assets" accept="image/*" multiple hidden>
</header>

<form class="source-bar" id="source-form" autocomplete="off">
	<label for="source-input">Source</label>
	<input id="source-input" type="text" spellcheck="false" placeholder="Plugin folder, readme.txt path, or URL, e.g. E:\sites\wp\wp-content\plugins\my-plugin or https://wordpress.org/plugins/my-plugin/">
	<button class="tb-btn primary" type="submit">Read</button>
	<label class="live-toggle" title="Watch the file or URL and update the preview when it changes"><input type="checkbox" id="live" checked> Live</label>
	<button class="tb-btn" type="button" id="btn-unlink" hidden>Unlink</button>
	<span class="src-status idle" id="src-status"></span>
</form>

<div class="workspace">
	<section class="editor-pane">
		<textarea id="src" spellcheck="false" placeholder="Paste a readme.txt here, or drop the file (and its banner, icon and screenshots) anywhere on the page."></textarea>
		<div class="side-panels">
			<div class="blk-validator">
				<div class="panel-h">Validator <span class="counts" id="counts"></span></div>
				<ul class="issues" id="issues"></ul>
			</div>
			<div class="blk-card">
				<div class="panel-h">Search result card</div>
				<div class="card-preview" id="card"></div>
				<p class="hint">Images are matched by name, as in the SVN <code>/assets</code> folder: <code>banner-772x250</code>, <code>banner-1544x500</code>, <code>icon-128x128</code>, <code>icon-256x256</code>, <code>icon.svg</code>, <code>screenshot-1</code> …</p>
			</div>
		</div>
	</section>

	<div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="Resize editor" tabindex="0" title="Drag to resize, double-click to reset"></div>

	<section class="preview-pane" id="preview" aria-label="Preview"></section>
</div>

<div class="drop-overlay">Drop readme.txt or images</div>
<div class="lightbox" id="lightbox" hidden><img alt=""><p></p></div>

<script src="readme-parser.js"></script>
<script>
(function () {
	'use strict';

	var W = window.WPReadme;
	var esc = W.esc, md = W.md, inline = W.inline;

	var $src = document.getElementById('src');

	var $issues = document.getElementById('issues');
	var $counts = document.getElementById('counts');

	var STORE_KEY = 'wp-readme-viewer:src';
	var VIEW_KEY = 'wp-readme-viewer:view';
	var state = { tab: 'details', openFaq: {} };
	var assets = { loaded: false, banner: null, bannerHigh: null, icon: null, screenshots: {} };

	var SAMPLE = [
		'=== Lightning Contact Form ===',

	].join('\n');

	/* ---------- helpers ---------- */

	function hash(s) {
		var h = 2166136261;
		for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
		return h >>> 0;
	}

	// Stand-in for the generated "geopattern" icon WordPress.org shows when no icon is uploaded.
	function patternIcon(name) {
		var h = hash(name || 'plugin');
		var hue = h % 360;
		var cells = '';
		for (var y = 0; y < 4; y++) {
			for (var x = 0; x < 4; x++) {
				var v = hash(name + x + ':' + y) % 100;
				var shape = v % 3;
				var op = (0.08 + (v % 7) * 0.05).toFixed(2);
				var fill = v % 2 ? '#fff' : '#000';
				var cx = x * 32 + 16, cy = y * 32 + 16;
				if (shape === 0) cells += '<circle cx="' + cx + '" cy="' + cy + '" r="14" fill="' + fill + '" fill-opacity="' + op + '"/>';
				else if (shape === 1) cells += '<rect x="' + (cx - 16) + '" y="' + (cy - 16) + '" width="32" height="32" fill="' + fill + '" fill-opacity="' + op + '"/>';
				else cells += '<path d="M' + (cx - 16) + ' ' + (cy + 16) + 'L' + cx + ' ' + (cy - 16) + 'L' + (cx + 16) + ' ' + (cy + 16) + 'Z" fill="' + fill + '" fill-opacity="' + op + '"/>';
			}
		}
		return '<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="128" height="128" fill="hsl(' + hue + ',45%,48%)"/>' + cells + '</svg>';
	}

	function iconHtml(name) {
		return assets.icon ? '<img src="' + esc(assets.icon) + '" alt="">' : patternIcon(name);
	}

	function avatar(user) {
		var hue = hash(user) % 360;
		return '<span class="avatar" style="background:hsl(' + hue + ',40%,45%)">' + esc(user.charAt(0)) + '</span>';
	}

	function profile(user) {
		return 'https://profiles.wordpress.org/' + encodeURIComponent(user) + '/';
	}

	function section(title, html, id) {
		return '<section' + (id ? ' id="' + id + '"' : '') + '><h2>' + esc(title) + '</h2>' + html + '</section>';
	}

	/* ---------- render ---------- */

	function renderScreenshots(r) {
		var shots = r.screenshots || [];
		var extra = Object.keys(assets.screenshots).map(Number).filter(function (n) {
			return !shots.some(function (s) { return s.n === n; });
		});
		var all = shots.concat(extra.map(function (n) { return { n: n, caption: '' }; }))
			.sort(function (a, b) { return a.n - b.n; });
		if (!all.length) return '';
		return '<ul class="wp-shots">' + all.map(function (s) {
			var img = assets.screenshots[s.n];
			var media = img
				? '<button type="button" data-shot="' + s.n + '"><img src="' + esc(img) + '" alt="' + esc(s.caption) + '"></button>'
				: '<div class="ph">screenshot-' + s.n + '.png</div>';
			return '<li><figure style="margin:0">' + media +
				(s.caption ? '<figcaption>' + inline(s.caption) + '</figcaption>' : '') + '</figure></li>';
		}).join('') + '</ul>';
	}

	function renderFaq(r) {
		var f = r.faq;
		if (!f) return '';
		var html = f.intro ? md(f.intro) : '';
		if (f.items.length) {
			html += '<dl class="wp-faq">' + f.items.map(function (it, k) {
				var open = !!state.openFaq[it.title];
				return '<dt class="' + (open ? 'open' : '') + '"><button type="button" aria-expanded="' + open + '" data-faq="' + k + '">' +
					inline(it.title) + '</button></dt><dd' + (open ? '' : ' hidden') + '>' + md(it.body) + '</dd>';
			}).join('') + '</dl>';
		}
		return html;
	}

	function render() {
		var text = $src.value;
		var r = W.parse(text);
		var h = r.headers;
		var name = r.name || 'Untitled plugin';
		state.parsed = r;

		/* validator */
		var issues = W.validate(r, assets);
		var nErr = issues.filter(function (i) { return i.level === 'error'; }).length;
		var nWarn = issues.filter(function (i) { return i.level === 'warning'; }).length;
		var nInfo = issues.length - nErr - nWarn;
		$counts.innerHTML =
			'<span class="count' + (nErr ? ' err' : '') + '">' + nErr + ' error' + (nErr === 1 ? '' : 's') + '</span>' +
			'<span class="count' + (nWarn ? ' warn' : '') + '">' + nWarn + ' warning' + (nWarn === 1 ? '' : 's') + '</span>' +
			'<span class="count">' + nInfo + ' note' + (nInfo === 1 ? '' : 's') + '</span>';
		$issues.innerHTML = issues.length
			? issues.map(function (i) { return '<li class="' + i.level + '"><span>' + i.msg + '</span></li>'; }).join('')
			: '<li class="ok"><span>No problems found.</span></li>';

		/* search card */
		var short = r.short || '';
		var plain = short.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '');
		var cardText = plain.length > 150
			? esc(plain.slice(0, 150)) + '<span class="cut">' + esc(plain.slice(150)) + '</span>'
			: esc(plain || '—');
		$card.innerHTML = '<div class="search-card"><div class="icon">' + iconHtml(name) + '</div><div><h3>' + esc(name) +
			'</h3><p>' + cardText + '</p></div></div>';

		if (!text.trim()) {
			$preview.innerHTML = '<div class="wporg"><p class="wp-empty">Paste a readme.txt on the left, open a file, or drop one onto the page.</p></div>';
			return;
		}

		/* details tab */
		var details = '';
		var desc = r.bySlug.description;
		details += section('Description', desc && desc.body ? md(desc.body) : '<p class="wp-empty">' + (short ? esc(short) : 'No description.') + '</p>', 'description');

		r.sections.forEach(function (s) {
			if (s.key === 'other') details += section(s.title, md(s.body));
		});

		var shots = renderScreenshots(r);
		if (shots) details += section('Screenshots', shots, 'screenshots');

		var faq = renderFaq(r);
		if (faq) details += section('FAQ', faq, 'faq');

		details += section('Reviews', '<p class="wp-empty">There are no reviews for this plugin.</p>', 'reviews-summary');

		var people = r.contributors.length
			? '<p>“' + esc(name) + '” is open source software. The following people have contributed to this plugin.</p>' +
				'<ul class="wp-people">' + r.contributors.map(function (c) {
					return '<li>' + avatar(c) + '<a href="' + profile(c) + '" target="_blank" rel="noopener">' + esc(c) + '</a></li>';
				}).join('') + '</ul>'
			: '<p class="wp-empty">No contributors listed.</p>';
		details += section('Contributors & Developers', people, 'developers');

		/* other tabs */
		var install = r.bySlug.installation && r.bySlug.installation.body
			? section('Installation', md(r.bySlug.installation.body))
			: section('Installation', '<p class="wp-empty">This section describes how to install the plugin and get it working.</p>');

		var reviews = section('Reviews', '<p class="wp-empty">There are no reviews for this plugin. Reviews come from WordPress.org users and are not part of readme.txt.</p>');

		var dev = section('Contributors & Developers', people) +
			section('Interested in development?', '<p>Browse the code, check out the SVN repository, or subscribe to the development log by RSS.</p>');
		if (r.bySlug.changelog) dev += section('Changelog', md(r.bySlug.changelog.body), 'changelog');
		if (r.upgradeNotice) {
			var un = r.upgradeNotice;
			dev += section('Upgrade Notice', (un.intro ? md(un.intro) : '') + un.items.map(function (it) {
				return '<h4>' + inline(it.title) + '</h4>' + md(it.body);
			}).join(''));
		}

		/* sidebar */
		function row(label, value) {
			return value
				? '<li><span>' + label + '</span><strong>' + value + '</strong></li>'
				: '<li class="na"><span>' + label + '</span><strong>—</strong></li>';
		}
		var version = h.stable_tag && !/^trunk$/i.test(h.stable_tag) ? esc(h.stable_tag) : '';
		var tags = r.tags.length
			? '<li><span>Tags</span><span class="wp-tags">' + r.tags.map(function (t, k) {
				return '<a href="#" class="' + (k >= 5 ? 'over' : '') + '" title="' + (k >= 5 ? 'Ignored: only 5 tags are used' : '') + '">' + esc(t) + '</a>';
			}).join('') + '</span></li>'
			: '';
		var sidebar =
			'<ul>' +
			row('Version', version) +
			row('Last updated', '') +
			row('Active installations', '') +
			row('WordPress version', h.requires ? esc(h.requires) + ' or higher' : '') +
			row('Tested up to', h.tested ? esc(h.tested) : '') +
			row('PHP version', h.requires_php ? esc(h.requires_php) + ' or higher' : '') +
			(h.requires_plugins ? row('Requires plugins', esc(h.requires_plugins)) : '') +
			row('Languages', '<a href="#">English (US)</a>') +
			tags +
			'</ul>' +
			'<a class="wp-advanced" href="#">Advanced View</a>' +
			'<div class="box"><h3>Ratings</h3><div class="stars" aria-label="No ratings">☆☆☆☆☆</div><p class="wp-empty" style="margin:4px 0 12px">No reviews have been submitted yet.</p>' +
			'<a class="wp-btn-outline" href="#">Add my review</a></div>' +
			(r.contributors.length ? '<div class="box"><h3>Contributors</h3><ul class="wp-people">' + r.contributors.map(function (c) {
				return '<li>' + avatar(c) + '<a href="' + profile(c) + '" target="_blank" rel="noopener">' + esc(c) + '</a></li>';
			}).join('') + '</ul></div>' : '') +
			'<div class="box"><h3>Support</h3><p>Got something to say? Need help?</p><a class="wp-btn-outline" href="#">View support forum</a></div>' +
			(h.donate_link ? '<div class="box"><h3>Donate</h3><p>Would you like to support the advancement of this plugin?</p><a class="wp-btn-outline" href="' +
				esc(/^https?:\/\//i.test(h.donate_link) ? h.donate_link : '#') + '" target="_blank" rel="noopener">Donate to this plugin</a></div>' : '');

		/* page */
		var banner = assets.bannerHigh || assets.banner;
		var by = r.contributors.length
			? 'By <a href="' + profile(r.contributors[0]) + '" target="_blank" rel="noopener">' + esc(r.contributors[0]) + '</a>'
			: '';
		

		var tabs = [['details', 'Details'], ['reviews', 'Reviews'], ['installation', 'Installation'], ['development', 'Development']];

		var scroll = $preview.scrollTop;
		$preview.innerHTML =
			'<article class="wporg">' +
			(banner ? '<div class="wp-banner" style="background-image:url(&quot;' + esc(banner) + '&quot;)"></div>' : '') +
			'<header class="wp-header">' +
				'<div class="wp-icon">' + iconHtml(name) + '</div>' +
				'<div class="wp-title-wrap"><h1 class="wp-title">' + esc(name) + '</h1><div class="wp-byline">' + by + '</div></div>' +
				'<a class="wp-download" href="#">Download</a>' +
			'</header>' +
			(short ? '<p class="short-desc">' + inline(short) + '</p>' : '') +
			'<nav class="wp-tabs" role="tablist">' + tabs.map(function (t) {
				return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '</button>';
			}).join('') + '<button type="button" class="support" tabindex="-1">Support</button></nav>' +
			'<div class="wp-grid">' +
				'<div class="wp-content">' +
					'<div class="wp-pane" data-pane="details"' + (state.tab === 'details' ? '' : ' hidden') + '>' + details + '</div>' +
					'<div class="wp-pane" data-pane="reviews"' + (state.tab === 'reviews' ? '' : ' hidden') + '>' + reviews + '</div>' +
					'<div class="wp-pane" data-pane="installation"' + (state.tab === 'installation' ? '' : ' hidden') + '>' + install + '</div>' +
					'<div class="wp-pane" data-pane="development"' + (state.tab === 'development' ? '' : ' hidden') + '>' + dev + '</div>' +
				'</div>' +
				'<aside class="wp-meta">' + sidebar + '</aside>' +
			'</div>' +
			'</article>';
		$preview.scrollTop = scroll;
	}

	/* ---------- events ---------- */

	var timer;
	$src.addEventListener('input', function () {
		clearTimeout(timer);
		timer = setTimeout(function () {
			render();
			try { localStorage.setItem(STORE_KEY, $src.value); } catch (e) {}
		}, 120);
	});

	$src.addEventListener('keydown', function (e) {
		if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
			e.preventDefault();
			var s = $src.selectionStart, en = $src.selectionEnd;
			$src.setRangeText('\t', s, en, 'end');
			$src.dispatchEvent(new Event('input'));
		}
	});

	$preview.addEventListener('click', function (e) {
		var t = e.target.closest('[data-tab]');
		if (t) {
			state.tab = t.getAttribute('data-tab');
			$preview.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', b === t); });
			$preview.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.getAttribute('data-pane') !== state.tab; });
			return;
		}
		var q = e.target.closest('[data-faq]');
		if (q) {
			var dt = q.parentNode, dd = dt.nextElementSibling;
			var open = dd.hidden;
			dd.hidden = !open;
			dt.classList.toggle('open', open);
			q.setAttribute('aria-expanded', open);
			state.openFaq[q.textContent] = open;
			return;
		}
		var shot = e.target.closest('[data-shot]');
		if (shot) {
			var n = +shot.getAttribute('data-shot');
			var cap = (state.parsed.screenshots || []).filter(function (s) { return s.n === n; })[0];
			$lightbox.querySelector('img').src = assets.screenshots[n];
			$lightbox.querySelector('p').innerHTML = cap ? n + '. ' + inline(cap.caption) : '';
			$lightbox.hidden = false;
			return;
		}
		var a = e.target.closest('a');
		if (a && a.getAttribute('href') === '#') e.preventDefault();
		else if (a && !a.target) a.target = '_blank';
	});

	$lightbox.addEventListener('click', function () { $lightbox.hidden = true; });
	document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $lightbox.hidden = true; });

	function setView(v) {
		document.body.setAttribute('data-view', v);
		document.querySelectorAll('.seg [data-view]').forEach(function (b) {
			b.setAttribute('aria-pressed', b.getAttribute('data-view') === v);
		});
		try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
	}
	document.querySelectorAll('.seg [data-view]').forEach(function (b) {
		b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
	});

	/* files */

	function loadReadme(file) {
		var fr = new FileReader();
		fr.onload = function () {
			unlink(true);
			$src.value = fr.result;
			state.openFaq = {};
			render();
			try { localStorage.setItem(STORE_KEY, $src.value); } catch (e) {}
		};
		fr.readAsText(file);
	}

	function addAsset(file) {
		return addAssetUrl(file.name.toLowerCase(), URL.createObjectURL(file));
	}

	// Images that came with a linked source replace whatever was there before.
	function setLinkedAssets(map) {
		assets.banner = assets.bannerHigh = assets.icon = null;
		assets.screenshots = {};
		assets.loaded = false;
		Object.keys(map || {}).sort().forEach(function (n) { addAssetUrl(n, map[n]); });
	}

	function addAssetUrl(n, url) {
		var m;
		if (/^banner-1544x500\./.test(n)) assets.bannerHigh = url;
		else if (/^banner-772x250\./.test(n) || /^banner/.test(n)) assets.banner = url;
		else if (/^icon(-\d+x\d+)?\./.test(n)) {
			// prefer svg, then the larger png
			if (!assets.icon || /\.svg$/.test(n) || /256/.test(n)) assets.icon = url;
		} else if ((m = n.match(/^screenshot-(\d+)\./))) assets.screenshots[+m[1]] = url;
		else return false;
		assets.loaded = true;
		return true;
	}

	function handleFiles(files) {
		var skipped = [];
		Array.prototype.forEach.call(files, function (f) {
			if (/\.(txt|md|markdown)$/i.test(f.name) || f.type === 'text/plain') loadReadme(f);
			else if (/^image\//.test(f.type)) { if (!addAsset(f)) skipped.push(f.name); }
			else skipped.push(f.name);
		});
		render();
		if (skipped.length) alert('Not recognised (expected readme.txt, banner-*, icon-*, screenshot-N):\n\n' + skipped.join('\n'));
	}

	document.getElementById('btn-open').onclick = function () { document.getElementById('file-readme').click(); };
	document.getElementById('btn-assets').onclick = function () { document.getElementById('file-assets').click(); };
	document.getElementById('file-readme').onchange = function () { handleFiles(this.files); this.value = ''; };
	document.getElementById('file-assets').onchange = function () { handleFiles(this.files); this.value = ''; };
	document.getElementById('btn-sample').onclick = function () {
		if (!link && $src.value.trim() && $src.value !== SAMPLE && !confirm('Replace the current text with the sample readme?')) return;
		unlink(true);
		$src.value = SAMPLE;
		$src.dispatchEvent(new Event('input'));
	};
	document.getElementById('btn-copy').onclick = function () {
		var el = $preview.querySelector('.wporg');
		var btn = this;
		if (!el || !navigator.clipboard) return;
		navigator.clipboard.writeText(el.outerHTML).then(function () {
			btn.textContent = 'Copied';
			setTimeout(function () { btn.textContent = 'Copy HTML'; }, 1200);
		});
	};

	var depth = 0;
	window.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
	window.addEventListener('dragleave', function () { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
	window.addEventListener('dragover', function (e) { e.preventDefault(); });
	window.addEventListener('drop', function (e) {
		e.preventDefault();
		depth = 0;
		document.body.classList.remove('dragging');
		if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
	});

	/* resizable split */
	var WIDTH_KEY = 'wp-readme-viewer:left';
	var $gutter = document.getElementById('gutter');
	var $workspace = document.querySelector('.workspace');

	function setLeft(px, save) {
		var max = $workspace.clientWidth - 320;
		px = Math.round(Math.max(240, Math.min(px, max)));
		$workspace.style.setProperty('--left', px + 'px');
		$gutter.setAttribute('aria-valuenow', px);
		if (save) { try { localStorage.setItem(WIDTH_KEY, px); } catch (e) {} }
	}

	$gutter.addEventListener('pointerdown', function (e) {
		if (e.button !== 0) return;
		e.preventDefault();
		$gutter.setPointerCapture(e.pointerId);
		document.body.classList.add('resizing');
		var left = $workspace.getBoundingClientRect().left;
		function move(ev) { setLeft(ev.clientX - left - 4, false); }
		function up(ev) {
			setLeft(ev.clientX - left - 4, true);
			document.body.classList.remove('resizing');
			$gutter.removeEventListener('pointermove', move);
			$gutter.removeEventListener('pointerup', up);
			$gutter.removeEventListener('pointercancel', up);
		}
		$gutter.addEventListener('pointermove', move);
		$gutter.addEventListener('pointerup', up);
		$gutter.addEventListener('pointercancel', up);
	});

	$gutter.addEventListener('dblclick', function () {
		$workspace.style.removeProperty('--left');
		try { localStorage.removeItem(WIDTH_KEY); } catch (e) {}
	});

	$gutter.addEventListener('keydown', function (e) {
		if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
		e.preventDefault();
		var cur = document.querySelector('.editor-pane').getBoundingClientRect().width;
		setLeft(cur + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 80 : 20), true);
	});

	window.addEventListener('resize', function () {
		if ($workspace.style.getPropertyValue('--left')) setLeft(parseFloat($workspace.style.getPropertyValue('--left')), false);
	});

	/* show / hide blocks */
	var BLOCKS_KEY = 'wp-readme-viewer:hidden';
	var $blocksMenu = document.getElementById('blocks-menu');
	var blockBoxes = document.querySelectorAll('[data-block]');

	function applyBlocks(save) {
		var hidden = [];
		blockBoxes.forEach(function (cb) {
			var name = cb.getAttribute('data-block');
			document.body.classList.toggle('hide-' + name, !cb.checked);
			if (!cb.checked) hidden.push(name);
		});
		if (save) { try { localStorage.setItem(BLOCKS_KEY, hidden.join(',')); } catch (e) {} }
	}
	blockBoxes.forEach(function (cb) { cb.addEventListener('change', function () { applyBlocks(true); }); });
	document.addEventListener('click', function (e) {
		if ($blocksMenu.open && !$blocksMenu.contains(e.target)) $blocksMenu.open = false;
	});
	try {
		var hiddenBlocks = (localStorage.getItem(BLOCKS_KEY) || '').split(',');
		blockBoxes.forEach(function (cb) { cb.checked = hiddenBlocks.indexOf(cb.getAttribute('data-block')) === -1; });
	} catch (e) {}
	applyBlocks(false);

	/* init */
	var saved = null, savedView = null, savedLeft = null;
	try { saved = localStorage.getItem(STORE_KEY); savedView = localStorage.getItem(VIEW_KEY); savedLeft = localStorage.getItem(WIDTH_KEY); } catch (e) {}
	if (savedLeft) setLeft(+savedLeft, false);
	$src.value = saved != null ? saved : SAMPLE;
	if (savedView) setView(savedView);
	render();

	/* linked source: a file / folder on this PC, or a URL */
	var SOURCE_KEY = 'wp-readme-viewer:source';
	var LIVE_KEY = 'wp-readme-viewer:live';
	var $srcInput = document.getElementById('source-input');
	var $live = document.getElementById('live');
	var $unlink = document.getElementById('btn-unlink');
	var $status = document.getElementById('src-status');
	var hasServer = false;
	var link = null; // { src, live, es, timer }

	function setStatus(kind, html) {
		$status.className = 'src-status ' + kind;
		$status.innerHTML = '<span class="dot"></span><span>' + html + '</span>';
	}

	function idleStatus() {
		setStatus('idle', hasServer
			? 'Not linked. Enter a plugin folder, a readme path or a URL.'
			: 'Static mode: URLs only, if the site allows it. Run <code>node server.js</code> and open <code>http://localhost:4321</code> to read files on this PC.');
	}

	function shortLabel(s) {
		return s.length > 80 ? '…' + s.slice(-78) : s;
	}

	function applyPayload(mine, p) {
		if (link !== mine) return;
		var top = $src.scrollTop;
		$src.value = p.text;
		$src.scrollTop = top;
		if (p.assets) setLinkedAssets(p.assets);
		render();
		var n = p.assets ? Object.keys(p.assets).length : 0;
		setStatus(mine.live ? 'live' : 'ok',
			(mine.live ? 'Live' : 'Loaded') + ' · ' + esc(shortLabel(p.label)) +
			(n ? ' · ' + n + ' image' + (n === 1 ? '' : 's') : '') +
			' · ' + new Date().toLocaleTimeString());
	}

	function unlink(forget) {
		if (link) {
			if (link.es) link.es.close();
			clearInterval(link.timer);
		}
		link = null;
		$src.readOnly = false;
		$src.removeAttribute('title');
		document.body.classList.remove('linked');
		$unlink.hidden = true;
		if (forget) {
			try { localStorage.removeItem(SOURCE_KEY); } catch (e) {}
			idleStatus();
		}
	}

	// Same page-to-raw rewrites as the server, for static mode.
	function directUrl(u) {
		var m;
		if ((m = u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/i))) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3];
		if ((m = u.match(/^https?:\/\/(?:[\w-]+\.)?wordpress\.org\/plugins\/([a-z0-9-]+)/i))) return 'https://plugins.svn.wordpress.org/' + m[1] + '/trunk/readme.txt';
		return u;
	}

	function linkTo(src) {
		src = (src || '').trim();
		if (!src) { $srcInput.focus(); return; }
		unlink(false);
		var mine = link = { src: src, live: $live.checked };
		try { localStorage.setItem(SOURCE_KEY, src); } catch (e) {}
		$src.readOnly = true;
		$src.title = 'Read-only while linked to ' + src + '. Click Unlink to edit here.';
		document.body.classList.add('linked');
		$unlink.hidden = false;
		setStatus('busy', 'Reading ' + esc(shortLabel(src)) + '…');

		function fail(e) {
			if (link !== mine) return;
			var msg = e && e.message === 'Failed to fetch'
				? 'The site blocked the request (CORS). Run <code>node server.js</code> to read any URL.'
				: esc(e && e.message ? e.message : String(e));
			setStatus('err', msg);
		}

		if (hasServer) {
			var q = encodeURIComponent(src);
			fetch('api/read?src=' + q, { cache: 'no-store' })
				.then(function (r) { return r.json().then(function (p) { if (!r.ok) throw new Error(p.error); return p; }); })
				.then(function (p) {
					applyPayload(mine, p);
					if (!mine.live || link !== mine) return;
					mine.es = new EventSource('api/watch?src=' + q);
					mine.es.onmessage = function (e) { applyPayload(mine, JSON.parse(e.data)); };
					mine.es.addEventListener('problem', function (e) { fail(new Error(JSON.parse(e.data).error)); });
					mine.es.onerror = function () {
						if (link === mine) setStatus('err', 'Lost the connection to the local server. Retrying…');
					};
				})
				.catch(function (e) {
					fail(e);
					$src.readOnly = false;
				});
			return;
		}

		if (!/^https?:\/\//i.test(src)) {
			fail(new Error('Reading a file or folder on this PC needs the local server. Run "node server.js" in the viewer folder, then open http://localhost:4321'));
			$src.readOnly = false;
			return;
		}

		var url = directUrl(src);
		function load() {
			return fetch(url, { cache: 'no-store' })
				.then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url); return r.text(); })
				.then(function (t) {
					if (t !== $src.value || !mine.loaded) {
						mine.loaded = true;
						applyPayload(mine, { text: t, label: src, assets: null });
					}
				});
		}
		load().then(function () {
			if (mine.live && link === mine) mine.timer = setInterval(function () { load().catch(fail); }, 5000);
		}).catch(function (e) {
			fail(e);
			$src.readOnly = false;
		});
	}

	document.getElementById('source-form').addEventListener('submit', function (e) {
		e.preventDefault();
		linkTo($srcInput.value);
	});
	$unlink.addEventListener('click', function () {
		unlink(true);
		try { localStorage.setItem(STORE_KEY, $src.value); } catch (e) {}
	});
	$live.addEventListener('change', function () {
		try { localStorage.setItem(LIVE_KEY, $live.checked ? '1' : '0'); } catch (e) {}
		if (link) linkTo(link.src);
	});

	var savedSource = null;
	try {
		savedSource = localStorage.getItem(SOURCE_KEY);
		if (localStorage.getItem(LIVE_KEY) === '0') $live.checked = false;
	} catch (e) {}
	if (savedSource) $srcInput.value = savedSource;

	(location.protocol === 'file:'
		? Promise.resolve(false)
		: fetch('api/ping', { cache: 'no-store' }).then(function (r) { return r.ok; }, function () { return false; })
	).then(function (ok) {
		hasServer = ok;
		if (savedSource) linkTo(savedSource);
		else idleStatus();
	});
})();
</script>
</body>
</html>
